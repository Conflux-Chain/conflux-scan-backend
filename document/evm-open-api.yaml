openapi: 3.0.3
info:
  title: Chain Scan OpenAPI
  description: |-
    Use any http client to fetch data from the ChainScan mainnet or testnet.

    ### Endpoints:

    | API Host | Net |
    |---|---|---|---|
    | [https://chainscan.0g.ai/open/doc](https://chainscan.0g.ai/open/doc) | Mainnet |
    | [https://chainscan-galileo.0g.ai/open/doc](https://chainscan-galileo.0g.ai/open/doc) | Testnet |

    ### Notes:

    - Timestamp is in seconds format.
    - Maximum `skip` is 10,000 when paging.
    - Maximum `limit` is 100 when paging.
    - The block list, transaction list, native token transfer list and token transfer list querying by account dimension can only view the latest 20,000 records due to data pruning.

    ### Rate Limit:

    Reference for various API tiers and their rate limits.

    | API Tier | Price | Rate Limit |
    |---|---|---|
    | Free | $0 | 5 calls/second, up to 100,000 calls/day |

  version: "0.0.3"
servers:
  - url: "https://chainscan.0g.ai"
    description: Mainnet
  - url: "https://chainscan-galileo.0g.ai"
    description: Testnet
security:
  - ApiKeyQuery: []    
  - ApiKeyHeader: []
tags:
  - name: "Accounts - Etherscan compatible"
    description: "Accounts - Etherscan compatible endpoints"
  - name: "Contracts - Etherscan compatible"
    description: "Contracts - Etherscan compatible endpoints"
  - name: "Blocks - Etherscan compatible"
    description: "Blocks - Etherscan compatible endpoints"
  - name: "Transactions - Etherscan compatible"
    description: "Transactions - Etherscan compatible endpoints"
  - name: "Stats - Etherscan compatible"
    description: "Stats - Etherscan compatible endpoints"  
  - name: "NFT Assets"
    description: "NFT endpoints for balances, tokens, owners, and transfers."
  - name: "Utils"
    description: "Utility endpoints such as transaction input decoding."
  - name: "Stats"
    description: "On-chain statistics and ranking data."
  - name: "data"
    description: "Low-level data listing and cursor-based retrieval endpoints."  
paths:
  "/api?module=account&action=balance":
    get:
      tags:
        - "Accounts - Etherscan compatible"
      summary: "Get native token balance for a single address at the specified tag or latest state."
      operationId: getNativeBalanceByAddress
      description: Get native token Balance for a Single Address
      parameters:
        - $ref: "#/components/parameters/addressMust"
        - $ref: "#/components/parameters/tag"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  "/api?module=account&action=balancemulti":
    get:
      tags:
        - "Accounts - Etherscan compatible"
      summary: "Get native token balances for multiple addresses in one request at the specified tag."
      operationId: getNativeBalancesByMultipleAddresses
      description: Get native token Balance for Multiple Addresses in a Single Call
      parameters:
        - $ref: "#/components/parameters/addressMust"
        - $ref: "#/components/parameters/tag"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceMulti"
  "/api?module=account&action=txlist":
    get:
      tags:
        - "Accounts - Etherscan compatible"
      summary: "List normal transactions for an address with block range, pagination, and sort order filters."
      operationId: listNormalTransactionsByAddress
      description: "Get a list of 'Normal' Transactions By Address"
      parameters:
        - $ref: "#/components/parameters/addressMust"
        - $ref: "#/components/parameters/startblock"
        - $ref: "#/components/parameters/endblock"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sortParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TxList"
  "/api?module=account&action=tokentx":
    get:
      tags:
        - "Accounts - Etherscan compatible"
      summary: "List ERC20 token transfer events filtered by address, contract address, block range, pagination, and sort order."
      operationId: listErc20TransferEventsByAddressOrContract
      description: |-
        Get a list of 'ERC20 - Token Transfer Events' by Address
        Usage:
        1. ERC-20 transfers from an address, specify the address parameter
        2. ERC-20 transfers from a contract address, specify the contract address parameter
        3. ERC-20 transfers from an address filtered by a token contract, specify both address and contract address parameters.
      parameters:
        - $ref: "#/components/parameters/contractaddress"
        - $ref: "#/components/parameters/address"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/startblock"
        - $ref: "#/components/parameters/endblock"
        - $ref: "#/components/parameters/sortParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer20List"
  "/api?module=account&action=tokennfttx":
    get:
      tags:
        - "Accounts - Etherscan compatible"
      summary: "List ERC721 token transfer events filtered by address, contract address, block range, pagination, and sort order."
      operationId: listErc721TransferEventsByAddressOrContract
      description: |-
        Get a list of 'ERC721 - Token Transfer Events' by Address
        Usage:
        1. ERC-721 transfers from an address, specify the address parameter
        2. ERC-721 transfers from a contract address, specify the contract address parameter
        3. ERC-721 transfers from an address filtered by a token contract, specify both address and contract address parameters.
      parameters:
        - $ref: "#/components/parameters/contractaddress"
        - $ref: "#/components/parameters/address"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/startblock"
        - $ref: "#/components/parameters/endblock"
        - $ref: "#/components/parameters/sortParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer721List"
  "/api?module=account&action=getminedblocks":
    get:
      tags:
        - "Accounts - Etherscan compatible"
      summary: "List blocks mined by the specified address, with block type and pagination options."
      operationId: listBlocksMinedByAddress
      description: Get list of Blocks Mined by Address
      parameters:
        - $ref: "#/components/parameters/addressMust"
        - $ref: "#/components/parameters/blocktype"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinedBlockList"
  "/api?module=account&action=balancehistory":
    get:
      tags:
        - "Accounts - Etherscan compatible"
      summary: "Get historical native token balance for a single address at a specific block number."
      operationId: getHistoricalNativeBalanceByAddressAndBlock
      description: Get Historical native token Balance for a Single Address By BlockNo
      parameters:
        - $ref: "#/components/parameters/addressMust"
        - $ref: "#/components/parameters/blocknoMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceHistory"
  "/api?module=contract&action=getabi":
    get:
      tags:
        - "Contracts - Etherscan compatible"
      summary: "Get verified contract ABI by contract address."
      operationId: getVerifiedContractAbiByAddress
      description: Get Contract ABI for Verified Contract Source Codes
      parameters:
        - $ref: "#/components/parameters/addressMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  "/api?module=contract&action=getsourcecode":
    get:
      tags:
        - "Contracts - Etherscan compatible"
      summary: "Get verified contract source code and verification metadata by contract address."
      operationId: getVerifiedContractSourceCodeByAddress
      description: Get Contract Source Code for Verified Contract Source Codes
      parameters:
        - $ref: "#/components/parameters/addressMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractInfo"
  "/api?module=contract&action=getcontractcreation":
    get:
      tags:
        - "Contracts - Etherscan compatible"
      summary: "Get deployer address and creation transaction hash for up to 5 contract addresses."
      operationId: getContractCreationInfoByContractAddresses
      description: "Returns a contract's deployer address and transaction hash it was created, up to 5 at a time."
      parameters:
        - $ref: "#/components/parameters/contractAddressesParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractCreationInfo"
  /api:
    post:
      tags:
        - "Contracts - Etherscan compatible"
      summary: "Submit verified contract source code for verification using form parameters and receive a tracking GUID or status message."
      operationId: submitContractSourceCodeVerification
      description: "Verify Source Code - Source Code Submission Gist"
      requestBody:
        content:
          "application/x-www-form-urlencoded":
            schema:
              $ref: "#/components/schemas/VerifySourcecode"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  "/api?module=contract&action=checkverifystatus":
    get:
      tags:
        - "Contracts - Etherscan compatible"
      summary: "Check source code verification submission status by GUID."
      operationId: checkContractSourceVerificationStatusByGuid
      description: "Verify Source Code - Check Source Code Verification Submission Status"
      parameters:
        - $ref: "#/components/parameters/guidMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractInfo"
  "/api?module=contract&action=verifyproxycontract":
    get:
      tags:
        - "Contracts - Etherscan compatible"
      summary: "Submit proxy contract verification for an address and optional expected implementation."
      operationId: submitProxyContractVerification
      description: Verifying Proxy Contract using cURL
      parameters:
        - $ref: "#/components/parameters/addressMust"
        - $ref: "#/components/parameters/expectedimplementation"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  "/api?module=contract&action=checkproxyverification":
    get:
      tags:
        - "Contracts - Etherscan compatible"
      summary: "Check proxy contract verification submission status by GUID."
      operationId: checkProxyContractVerificationStatusByGuid
      description: Checking Proxy Contract Verification Submission Status using cURL
      parameters:
        - $ref: "#/components/parameters/guidMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  "/api?module=transaction&action=getstatus":
    get:
      tags:
        - "Transactions - Etherscan compatible"
      summary: "Get contract execution status for a transaction hash."
      operationId: getContractExecutionStatusByTransactionHash
      description: Check Contract Execution Status
      parameters:
        - $ref: "#/components/parameters/txhashMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractExecutionStatus"
  "/api?module=transaction&action=gettxreceiptstatus":
    get:
      tags:
        - "Transactions - Etherscan compatible"
      summary: "Get transaction receipt status for a transaction hash."
      operationId: getTransactionReceiptStatusByTransactionHash
      description: Check Transaction Receipt Status
      parameters:
        - $ref: "#/components/parameters/txhashMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionReceiptStatus"
  "/api?module=block&action=getblocknobytime":
    get:
      tags:
        - "Blocks - Etherscan compatible"
      summary: "Get the closest block number before or after a given Unix timestamp."
      operationId: getBlockNumberClosestToTimestamp
      description: Get Block Number by Timestamp
      parameters:
        - $ref: "#/components/parameters/timestampMust"
        - $ref: "#/components/parameters/closest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"              
  "/api?module=stats&action=tokensupply":
    get:
      tags:
        - "Tokens - Etherscan compatible"
      summary: "Get current ERC20 total supply by contract address."
      operationId: getErc20TotalSupplyByContractAddress
      description: "Get ERC20-Token TotalSupply by ContractAddress"
      parameters:
        - $ref: "#/components/parameters/contractaddressMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  "/api?module=account&action=tokenbalance":
    get:
      tags:
        - "Tokens - Etherscan compatible"
      summary: "Get ERC20 token balance for an address under a specific token contract."
      operationId: getErc20TokenBalanceByAddressAndContract
      description: "Get ERC20-Token Account Balance for TokenContractAddress"
      parameters:
        - $ref: "#/components/parameters/contractaddressMust"
        - $ref: "#/components/parameters/addressMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  "/api?module=stats&action=tokensupplyhistory":
    get:
      tags:
        - "Tokens - Etherscan compatible"
      summary: "Get historical ERC20 total supply by contract address and block number."
      operationId: getHistoricalErc20TotalSupplyByContractAddressAndBlock
      description: "Get Historical ERC20-Token TotalSupply by ContractAddress & BlockNo"
      parameters:
        - $ref: "#/components/parameters/contractaddressMust"
        - $ref: "#/components/parameters/blocknoMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  "/api?module=account&action=tokenbalancehistory":
    get:
      tags:
        - "Tokens - Etherscan compatible"
      summary: "Get historical ERC20 token balance for an address and contract at a specific block number."
      operationId: getHistoricalErc20TokenBalanceByAddressContractAndBlock
      description: "Get Historical ERC20-Token Account Balance for TokenContractAddress by BlockNo"
      parameters:
        - $ref: "#/components/parameters/contractaddressMust"
        - $ref: "#/components/parameters/addressMust"
        - $ref: "#/components/parameters/blocknoMust"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  /nft/balances:
    get:
      tags:
        - NFT Assets
      summary: "List NFT asset balances for an owner address with pagination."
      operationId: listNftBalancesByOwner
      description: Get balances of NFT assets for account address.
      parameters:
        - $ref: "#/components/parameters/ownerParamMust"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NFTBalanceList"
  /nft/tokens:
    get:
      tags:
        - NFT Assets
      summary: "List NFT tokens by owner and/or contract, with cursor or skip pagination, sorting, and optional brief metadata."
      operationId: listNftTokensByOwnerOrContract
      description: |-
        Get token id array of specified NFT contract for account address.
        At least one of the parameters 'contract' and 'owner' is required.
      parameters:
        - $ref: "#/components/parameters/contractParam"
        - $ref: "#/components/parameters/ownerParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/sortFieldParam"
        - $ref: "#/components/parameters/cursorParamWithoutMaximum"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/withBriefParam"
        - $ref: "#/components/parameters/withMetadataParam"
        - $ref: "#/components/parameters/suppressMetadataErrorParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NFTTokenList"
  /nft/preview:
    get:
      tags:
        - NFT Assets
      summary: "Get preview information and optional metadata for a specific NFT by contract address and token ID."
      operationId: getNftPreviewByContractAndTokenId
      description: View the NFT for the specified contract address and tokenID.
      parameters:
        - $ref: "#/components/parameters/contractParamMust"
        - $ref: "#/components/parameters/tokenIdParamMust"
        - $ref: "#/components/parameters/withMetadataParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NFTPreview"
  /nft/fts:
    get:
      tags:
        - NFT Assets
      summary: "Search NFTs by metadata name and optionally by contract address."
      operationId: searchNftsByNameOrContract
      description: Search the NFT by NFT name and/or contract address.
      parameters:
        - $ref: "#/components/parameters/nameParamMust"
        - $ref: "#/components/parameters/contractParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NFTTokenFtsList"
  /nft/owners:
    get:
      tags:
        - NFT Assets
      summary: "List owners of an NFT collection or specific token, with cursor pagination."
      operationId: listNftOwnersByContractOrTokenId
      description: Get a list of owners for a NFT or a NFT collection. The owners are sorted by transfer timestamp with ascending direction
      parameters:
        - $ref: "#/components/parameters/contractParamMust"
        - $ref: "#/components/parameters/tokenIdParam"
        - $ref: "#/components/parameters/cursorParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NFTOwnerList"
  /nft/transfers:
    get:
      tags:
        - NFT Assets
      summary: "List NFT transfer records for a collection or token, filterable by participants, block range, timestamps, pagination, and sort order."
      operationId: listNftTransfersByContractOrTokenId
      description: Get a list of transfers for a NFT
      parameters:
        - $ref: "#/components/parameters/contractParamMust"
        - $ref: "#/components/parameters/tokenIdParam"
        - $ref: "#/components/parameters/cursorParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/fromParam"
        - $ref: "#/components/parameters/toParam"
        - $ref: "#/components/parameters/startBlockParam"
        - $ref: "#/components/parameters/endBlockParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferList"
  /util/decode/method:
    get:
      tags:
        - Utils
      summary: "Decode method data for up to 10 verified-contract transactions by transaction hash."
      operationId: decodeVerifiedContractMethodByTransactionHashes
      description: "Decode the data of the transaction, where the `to` address of the transaction is the verified contract. Supports up to 10 transactions at a time."
      parameters:
        - $ref: "#/components/parameters/hashesParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodedMethod"
  /util/decode/method/raw:
    get:
      tags:
        - Utils
      summary: "Decode method data for up to 10 verified-contract raw inputs by contract address and calldata."
      operationId: decodeVerifiedContractMethodByRawContractAndInput
      description: "Decode the data of the raw transaction, where the `to` address of the transaction is the verified contract. Supports up to 10 transactions at a time."
      parameters:
        - $ref: "#/components/parameters/contractsParam"
        - $ref: "#/components/parameters/inputsParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodedMethodRaw"
  /statistics/tps:
    get:
      tags:
        - Stats
      summary: "List TPS statistics over time, filterable by interval, timestamps, pagination, and sort order."
      operationId: listTpsStatisticsByInterval
      description: "Get statistics of tps within ${limit} ${intervalType}."
      parameters:
        - name: intervalType
          description: "Indicate calculation period, should be one of min(minute), hour or day. Default is hour."
          in: query
          required: false
          schema:
            type: string
            default: hour
            enum:
              - min
              - hour
              - day
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParamStat"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TpsStat"
  /statistics/contract:
    get:
      tags:
        - Stats
      summary: "List deployed contract statistics over time, filterable by timestamps, pagination, and sort order."
      operationId: listDeployedContractStatistics
      description: Get statistics of deployed contract.
      parameters:
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParamStat"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDeployedStat"
  /statistics/account/growth:
    get:
      tags:
        - Stats
      summary: "List daily account growth statistics, filterable by timestamps, pagination, and sort order."
      operationId: listDailyAccountGrowthStatistics
      description: Get statistics of account growth by daily.
      parameters:
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParamStat"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGrowthStat"
  /statistics/account/active:
    get:
      tags:
        - Stats
      summary: "List daily active sender statistics, filterable by timestamps, pagination, and sort order."
      operationId: listDailyActiveSenderStatistics
      description: Get statistics of tx sender by daily.
      parameters:
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParamStat"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountActiveStat"
  /statistics/transaction:
    get:
      tags:
        - Stats
      summary: "List daily transaction statistics, filterable by timestamps, pagination, and sort order."
      operationId: listDailyTransactionStatistics
      description: Get statistics of transaction account by daily.
      parameters:
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParamStat"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStat"
  /statistics/token/transfer:
    get:
      tags:
        - Stats
      summary: "List daily token transfer statistics, optionally filtered by token contract and by timestamps, pagination, and sort order."
      operationId: listDailyTokenTransferStatistics
      description: Get statistics of token transfer by daily.
      parameters:
        - $ref: "#/components/parameters/contractParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParamStat"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenTransferStat"
  /statistics/top/gas/used:
    get:
      tags:
        - Stats
      summary: "List top gas-using entities for a selected time span of 24h, 3d, or 7d."
      operationId: listTopGasUsedStatistics
      description: Get statistics of gas used for top 10.
      parameters:
        - $ref: "#/components/parameters/spanParam"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GasUsedTopStat"
  /statistics/top/miner:
    get:
      tags:
        - Stats
      summary: "List top miners for a selected time span of 24h, 3d, or 7d."
      operationId: listTopMinerStatistics
      description: Get statistics of miner for top 10.
      parameters:
        - $ref: "#/components/parameters/spanParam"
      responses:
        "200":
          description: ""
