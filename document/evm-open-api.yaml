                        type: string
                        description: "Account address, it's like 0x672158893ce87d812befd2209bc1b7818fe48b2a"
                      to:
                        type: string
                        description: "Account address, it's like 0x672158893ce87d812befd2209bc1b7818fe48b2a"
                      amount:
                        type: string
                        description: "The native token value or token amount in the transfer, the string is not divided by the native-token/token decimal"
                      tokenId:
                        type: string
                        description: "The token id in ERC721/ERC1155 transfer, otherwise it is 0"
                      timestamp:
                        type: integer
                        description: Timestamp in seconds
                addressInfo:
                  $ref: "#/components/schemas/AddressInfo"
    VerifySourcecode:
      type: object
      properties:
        module:
          type: string
          required: true
          description: request module
          default: contract
        action:
          type: string
          required: true
          description: request action
          default: verifysourcecode
        contractaddress:
          type: string
          required: true
          description: the address your contract is deployed at
        sourceCode:
          type: string
          required: true
          description: contract source code
        codeformat:
          type: string
          required: true
          description: |-
            solidity single file, use solidity-single-file
            solidity JSON file ( recommended ), use solidity-standard-json-input
            vyper JSON file, use vyper-json
            fe JSON file, use fe-json
        contractname:
          type: string
          required: true
          description: |-
            the name of your contract, such as
            contracts/Verified.sol:Verified
        compilerversion:
          type: string
          required: true
          description: |-
            compiler version used
            for solc compiler, such as v0.8.24+commit.e11b9ed9
            for vyper compiler, such as vyper:0.4.0
            for fe compiler, such as fe:26.0.0-alpha.12
        optimizationUsed:
          type: string
          required: true
          description: |-
            for solc compiler, 0 = No Optimization, 1 = Optimization used 
            for vyper compiler, can be one of gas, codesize, none, 0 = No Optimization, 1 = Optimization (the last two are for backwards compatibility)
            applicable when codeformat is solidity-single-file or vyper-single-file
          default: 0
        runs:
          type: number
          required: true
          description: |-
            set to 200 as default unless otherwise  
            applicable when codeformat is solidity-single-file
          default: 200
        constructorArguements:
          type: string
          required: false
          description: "optional, include if your contract uses constructor arguments"
          nullable: true
          alias: constructorArguments
        evmversion:
          type: string
          required: false
          description: |-
            optional, leave blank for compiler default, 
            applicable when codeformat is solidity-single-file or vyper-single-file
          nullable: true
        license:
        licenseType:
          type: string
          required: true
          description: |-
            Valid codes 1-14 where
            1.  No License (None)
            2.  The Unlicense (Unlicense)
            3. 	MIT License (MIT)
            4. 	GNU General Public License v2.0 (GNU GPLv2)
            5. 	GNU General Public License v3.0 (GNU GPLv3)
            6. 	GNU Lesser General Public License v2.1 (GNU LGPLv2.1)
            7. 	GNU Lesser General Public License v3.0 (GNU LGPLv3)
            8. 	BSD 2-clause 'Simplified' license (BSD-2-Clause)
            9. 	BSD 3-clause 'New' Or 'Revised' license* (BSD-3-Clause)
            10. Mozilla Public License 2.0 (MPL-2.0)
            11. Open Software License 3.0 (OSL-3.0)
            12. Apache 2.0 (Apache-2.0)
            13. GNU Affero General Public License (GNU AGPLv3)
            14. Business Source License (BSL 1.1)
          default: 1
        libraryname1:
          type: string
          required: false
          description: "if applicable, a matching pair with libraryaddress1 required"
        libraryaddress1:
          type: string
          required: false
          description: "if applicable, a matching pair with libraryname1 required"
        libraryname2:
          type: string
          required: false
          description: "if applicable, matching pair required"
