      in: query
      description: "the string pre-defined block parameter, either latest_mined, latest_state, latest_finalized, latest_confirmed, latest_checkpoint or earliest"
      required: false
      schema:
        type: string
        enum:
          - latest_mined
          - latest_state
          - latest_finalized
          - latest_confirmed
          - latest_checkpoint
          - earliest
        default: latest_state
    blocktype:
      name: blocktype
      in: query
      description: "the string pre-defined block type, only support 'blocks' type"
      required: false
      schema:
        type: string
        default: blocks
    page:
      name: page
      in: query
      description: "the integer page number, if pagination is enabled"
      required: false
      schema:
        type: integer
        default: 1
        maximum: 10000
    offset:
      name: offset
      in: query
      description: the number of transactions displayed per page
      required: false
      schema:
        type: integer
        maximum: 100
        default: 100
    blocknoMust:
      name: blockno
      in: query
      description: the integer block number to check balance for eg. 12697906
      required: true
      schema:
        type: integer
    blockno:
      name: blockno
      in: query
      description: the integer block number to check balance for eg. 12697906
      required: false
      schema:
        type: integer
    timestampMust:
      description: the integer representing the Unix timestamp in seconds
      name: timestamp
      in: query
      required: true
      schema:
        type: integer
    closest:
      description: "the closest available block to the provided timestamp, either before or after"
      name: closest
      in: query
      required: false
      schema:
        type: string
        enum:
          - before
          - after
        default: before
    startblock:
      name: startblock
      in: query
      description: the integer block number to start searching for transactions
      required: false
      schema:
        type: integer
    endblock:
      name: endblock
      in: query
      description: the integer block number to stop searching for transactions
      required: false
      schema:
        type: integer
    sortParam:
      description: "the sorting preference, use asc to sort by ascending and desc to sort by descending"
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    skipParam:
      name: skip
      in: query
      description: "The number of skipped records, usually it's pageSize * (pageNumber - 1). Maximum 10000."
      required: false
      schema:
        type: integer
        default: 0
        maximum: 10000
    skipParamWithoutMaximum:
      name: skip
      in: query
      description: "The number of skipped records, usually it's pageSize * (pageNumber - 1)."
      required: false
      schema:
        type: integer
        default: 0
        maximum: 10000
    cursorParamWithoutMaximum:
      name: cursor
      in: query
      description: A cursor to retrieve the next page
      required: false
      schema:
        type: string
        default: "0"
    limitParam:
      name: limit
