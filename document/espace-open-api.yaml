openapi: 3.0.3
info:
  title: ConfluxScan eSpace OpenAPI
  description: |-
    Use any http client to fetch data from the ConfluxScan mainnet or testnet.

    ### Endpoints:

    | API Host | Net | Mode | Scan |
    |---|---|---|---|
    | [https://api.confluxscan.__tld__](https://api.confluxscan.__tld__/doc) | Mainnet Core | Production | [https://confluxscan.__tld__](https://confluxscan.__tld__) |
    | [https://evmapi.confluxscan.__tld__](https://evmapi.confluxscan.__tld__/doc) | Mainnet eSpace | Production | [https://evm.confluxscan.__tld__](https://evm.confluxscan.__tld__) |
    | [https://api-testnet.confluxscan.__tld__](https://api-testnet.confluxscan.__tld__/doc) | Testnet Core | Production | [https://testnet.confluxscan.__tld__](https://testnet.confluxscan.__tld__) |
    | [https://evmapi-testnet.confluxscan.__tld__](https://evmapi-testnet.confluxscan.__tld__/doc) | Testnet eSpace | Production | [https://evmtestnet.confluxscan.__tld__](https://evmtestnet.confluxscan.__tld__) |

    ### Notes:

    - Timestamp is in seconds format.
    - Maximum `skip` is 10,000 when paging.
    - Maximum `limit` is 100 when paging.
    - The block list, transaction list, CFX transfer list and token transfer list querying by account dimension can only view the latest 20,000 records due to data pruning.

    ### Rate Limit:

    Reference for various API tiers and their rate limits.

    | API Tier | Price | Rate Limit |
    |---|---|---|
    | Free | $0 | 5 calls/second, up to 100,000 calls/day |
    | Standard | $150/mo | 20 calls/second, up to 500,000 calls/day |
    | Enterprise | For details, please email bd@confluxnetwork.org | Customize according to demand |

    ### SDK:

    | Space | Link |
    |---|---|
    | Core | [openapi-sdk-core](https://www.npmjs.com/package/@conflux-lib/openapi-sdk-core) |
    | EVM | [openapi-sdk-evm](https://www.npmjs.com/package/@conflux-lib/openapi-sdk-evm) |
  version: "0.0.3"
servers:
  - url: "https://evmapi.confluxscan.__tld__"
    description: Mainnet eSpace
  - url: "https://evmapi-testnet.confluxscan.__tld__"
    description: Testnet eSpace
security:
  - ApiKeyQuery: []    
  - ApiKeyHeader: []
