      tags:
        - "Accounts - Etherscan compatible"
      summary: "List internal transactions filtered by address, transaction hash, or block range, with pagination and sort order."
      operationId: listInternalTransactionsByAddressTxHashOrBlockRange
      description: |-
        Get a list of 'Internal' Transactions.
        Usage:
        1. Get 'Internal' Transactions by Address.
           example:
               https://evmapi.confluxscan.net/api
               ?module=account
               &action=txlistinternal
               &address=0x2c1ba59d6f58433fb1eaee7d20b26ed83bda51a3
               &startblock=0
               &endblock=2702578
               &page=1
               &offset=10
               &sort=asc
               &apikey=YourApiKeyToken
        2. Get 'Internal Transactions' by Transaction Hash.
           example:
               https://evmapi.confluxscan.net/api
               ?module=account
               &action=txlistinternal
               &txhash=0x40eb908387324f2b575b4879cd9d7188f69c8fc9d87c901b9e2daaea4b442170
               &apikey=YourApiKeyToken
        3. Get 'Internal Transactions' by Block Range.
           example:
               https://evmapi.confluxscan.net/api
               ?module=account
               &action=txlistinternal
               &startblock=13481773
               &endblock=13491773
               &page=1
               &offset=10
               &sort=asc
               &apikey=YourApiKeyToken
      parameters:
        - $ref: "#/components/parameters/txhash"
        - $ref: "#/components/parameters/address"
        - $ref: "#/components/parameters/startblock"
        - $ref: "#/components/parameters/endblock"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sortParam"
