  examples:
    SignatureSearchResults:
      summary: Successful lookup with results
      value:
        code: 0
        message: OK
        data:
          function:
            0xa9059cbb:
              - signature: "transfer(address,uint256)"
                fullFormat: "function transfer(address to, uint256 amount) returns (bool)"
                hasVerifiedContract: true
            0x095ea7b3:
              - signature: "approve(address,uint256)"
                fullFormat: "function approve(address spender, uint256 amount) returns (bool)"
                hasVerifiedContract: true
          error:
            0xfe34a6d3:
              - signature: "NotFromEntryPoint(address,address,address)"
                fullFormat: "error NotFromEntryPoint(address msgSender, address entity, address entryPoint)"
                hasVerifiedContract: true
            0x5a154675:
              - signature: "ExecuteError(uint256,bytes)"
                fullFormat: "error ExecuteError(uint256 index, bytes error)"
                hasVerifiedContract: true
          event:
            0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef:
              - signature: "Transfer(address,address,uint256)"
                fullFormat: "event Transfer(address indexed from,address indexed to,uint256 value)"
                hasVerifiedContract: true
            0x8c5be1e5ebec7d5bd14f71427d1e84f3dd0314c0f7b2291e5b200ac8c7c3b925:
              - signature: "Approval(address,address,uint256)"
                fullFormat: "event Approval(address indexed owner,address indexed spender,uint256 value)"
                hasVerifiedContract: true
