openapi: 3.0.3
info:
  title: Conflux Scan Open Api
  description: |-
    Use any http client to fetch data from the ConfluxScan mainnet or testnet.

    ### Endpoints:

    | API Host | Net | Mode | Scan |
    |---|---|---|---|
    | [https://api.confluxscan.org](https://api.confluxscan.org/doc) | Mainnet Core | Production | [https://confluxscan.org](https://confluxscan.org) |
    | [https://evmapi.confluxscan.org](https://evmapi.confluxscan.org/doc) | Mainnet eSpace | Production | [https://evm.confluxscan.org](https://evm.confluxscan.org) |
    | [https://api-testnet.confluxscan.org](https://api-testnet.confluxscan.org/doc) | Testnet Core | Production | [https://testnet.confluxscan.org](https://testnet.confluxscan.org) |
    | [https://evmapi-testnet.confluxscan.org](https://evmapi-testnet.confluxscan.org/doc) | Testnet eSpace | Production | [https://evmtestnet.confluxscan.org](https://evmtestnet.confluxscan.org) |

    ### Notes:

    - Timestamp is in seconds format.
    - Maximum `skip` is 10,000 when paging.
    - Maximum `limit` is 100 when paging.
    - The block list, transaction list, CFX transfer list and token transfer list querying by account dimension can only view the latest 20,000 records due to data pruning.

    ### Rate Limit:

    Reference for various API tiers and their rate limits.

    | API Tier | Price | Rate Limit |
    |---|---|---|
    | Free | $0 | 5 calls/second, up to 100,000 calls/day |
    | Standard | $150/mo | 20 calls/second, up to 500,000 calls/day |
    | Enterprise | For details, please email bd@confluxnetwork.org | Customize according to demand |

    ### SDK:

    | Space | Link |
    |---|---|
    | Core | [openapi-sdk-core](https://www.npmjs.com/package/@conflux-lib/openapi-sdk-core) |
    | EVM | [openapi-sdk-evm](https://www.npmjs.com/package/@conflux-lib/openapi-sdk-evm) |

    [Draft] Strict-compatible refactor: keep all original URLs unchanged; enhance metadata/security/error responses.
  version: 0.0.3
servers:
  - url: "https://api.confluxscan.org"
    description: Mainnet Core
  - url: "https://api.confluxscan.net"
    description: Mainnet Core  
  - url: "https://api-testnet.confluxscan.org"
    description: Testnet Core
  - url: "https://api-testnet.confluxscan.net"
    description: Testnet Core  
security:
  - ApiKeyQuery: []    
  - ApiKeyHeader: []
tags:
  - name: "Server Info"
    description: "Service and version information."
  - name: "Accounts"
    description: "Account-related endpoints for transactions, transfers, assets, approvals, and account information."
  - name: "Contracts"
    description: "Contract endpoints for ABI, source code, deployment, verification, and signature lookup."
  - name: "Tokens"
    description: "Token information and refresh endpoints."
  - name: "NFT Assets"
    description: "NFT endpoints for balances, tokens, owners, and transfers."
  - name: "Utils"
    description: "Utility endpoints such as transaction input decoding."
  - name: "Stats"
    description: "On-chain statistics and ranking data."
  - name: "data"
    description: "Low-level data listing and cursor-based retrieval endpoints."
paths:
  /version:
    get:
      tags:
        - 'Server Info'
      summary: "Get service version information"
      operationId: getVersion
      description: "Get server version."
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /account/transactions:
    get:
      tags:
        - 'Accounts'
      summary: "List transactions associated with an account, filterable by direction, block range, timestamps, pagination, and sort order."
      operationId: listTransactionsByAccount
      description: "Get transactions associated with an account. A transaction with 'from' or 'to' equals to specified account
        is considered as 'associate'. Parameters 'from' and 'to' are [or] logic."
      parameters:
        - $ref: "#/components/parameters/account"
        - $ref: "#/components/parameters/skipParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/minEpochNumberParam"
        - $ref: "#/components/parameters/maxEpochNumberParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/withInputParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
  /account/cfx/transfers:
    get:
      tags:
        - 'Accounts'
      summary: "List native CFX transfer records for an account, filterable by direction, block range, timestamps, pagination, and sort order."
      operationId: listNativeTransfersByAccount
      description: "Get cfx transfer records of an account."
      parameters:
        - $ref: "#/components/parameters/account"
        - $ref: "#/components/parameters/skipParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/minEpochNumberParam"
        - $ref: "#/components/parameters/maxEpochNumberParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCfxList"
  /account/crc20/transfers:
    get:
      tags:
        - 'Accounts'
      summary: "List CRC20 transfer records for an account, optionally filtered by token contract, direction, block range, timestamps, pagination, and sort order."
      operationId: listCrc20TransfersByAccount
      description: "Get crc20 transfer records of an account."
      parameters:
        - $ref: "#/components/parameters/account"
        - $ref: "#/components/parameters/skipParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/contractParam"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/minEpochNumberParam"
        - $ref: "#/components/parameters/maxEpochNumberParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer20List"
  /account/crc721/transfers:
    get:
      tags:
        - 'Accounts'
      summary: "List CRC721 transfer records for an account, optionally filtered by contract, token ID, direction, block range, timestamps, pagination, and sort order."
      operationId: listCrc721TransfersByAccount
      description: "Get crc721 transfer records of an account"
      parameters:
        - $ref: "#/components/parameters/account"
        - $ref: "#/components/parameters/skipParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/contractParam"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/minEpochNumberParam"
        - $ref: "#/components/parameters/maxEpochNumberParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/tokenIdParam"
        - $ref: "#/components/parameters/sortParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer721List"
  /account/crc1155/transfers:
    get:
      tags:
        - 'Accounts'
      summary: "List CRC1155 transfer records for an account, optionally filtered by contract, token ID, direction, block range, timestamps, pagination, and sort order."
      operationId: listCrc1155TransfersByAccount
      description: "Get crc1155 transfer records of an account"
      parameters:
        - $ref: "#/components/parameters/account"
        - $ref: "#/components/parameters/skipParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/contractParam"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/minEpochNumberParam"
        - $ref: "#/components/parameters/maxEpochNumberParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/tokenIdParam"
        - $ref: "#/components/parameters/sortParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer1155List"
  /account/crc3525/transfers:
    get:
      tags:
        - 'Accounts'
      summary: "List CRC3525 transfer records for an account, optionally filtered by contract, token ID, direction, block range, timestamps, pagination, and sort order."
      operationId: listCrc3525TransfersByAccount
      description: "Get crc3525 transfer records of an account"
      parameters:
        - $ref: "#/components/parameters/account"
        - $ref: "#/components/parameters/skipParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/contractParam"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/minEpochNumberParam"
        - $ref: "#/components/parameters/maxEpochNumberParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/tokenIdParam"
        - $ref: "#/components/parameters/sortParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer3525List"
  /account/transfers:
    get:
      tags:
        - 'Accounts'
      summary: "List all transfer records related to an account across native and token transfers, with cursor or skip pagination, filtering, and sort options."
      operationId: listAllTransfersByAccountWithCursor
      description: "Get all transfer records (includes: cfx transfer, crc20/crc721/crc1155 transfer) of an account"
      parameters:
        - $ref: "#/components/parameters/account"
        - $ref: "#/components/parameters/cursorParamWithoutMaximum"
        - $ref: "#/components/parameters/skipParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/contractParam"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/minEpochNumberParam"
        - $ref: "#/components/parameters/maxEpochNumberParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/tokenIdParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/transferTypeParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferListWithCursor"
  /account/approvals:
    get:
      tags:
        - 'Accounts'
      summary: "List token approvals for an account, filterable by token type and optional per-token-id NFT expansion."
      operationId: listTokenApprovalsByAccount
      description: "Get token approvals of an account"
      parameters:
        - $ref: "#/components/parameters/account"
        - name: tokenType
          in: query
          required: false
          schema:
            type: string
            default: ""
            enum:
              - ERC20
              - ERC721
              - ERC1155
        - name: byTokenId
          in: query
          description: Whether to query each NFT token id, only valid for ERC721.
          required: false
          schema:
            type: boolean
            default: false
            enum:
              - true
              - false
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approvals"
  /account/tokens:
    get:
      tags:
        - 'Accounts'
      summary: "List assets held by an account, filterable by token type and paginated by skip and limit."
      operationId: listAssetsHeldByAccount
      description: "Get assets held by an account. Some tokens may not show up for some reasons."
      parameters:
        - $ref: "#/components/parameters/account"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParamWithMax100"
        - $ref: "#/components/parameters/tokenTypeParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetsOfAccount"
  /account/infos:
    get:
      tags:
        - 'Accounts'
      summary: "Get enriched info for up to 100 accounts, including contract, name tag, eSpace, ENS, and proxy implementation details."
      operationId: getBatchAccountInfos
      description: "Get the accounts' name information. Supports up to 100 account at a time."
      parameters:
        - $ref: "#/components/parameters/accountArrayParam"
        - $ref: "#/components/parameters/withContractInfo"
        - $ref: "#/components/parameters/withNameTagInfo"
        - $ref: "#/components/parameters/withByte32NameTagInfo"
        - $ref: "#/components/parameters/withESpaceInfo"
        - $ref: "#/components/parameters/withENSInfo"
        - $ref: "#/components/parameters/withProxyImplInfo"
        - $ref: "#/components/parameters/realtimeProxyImpl"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfos"
  /contract/getabi:
    get:
      tags:
        - 'Contracts'
      summary: "Get verified contract ABI by contract address."
      operationId: getVerifiedContractAbiByAddress
      description: "Get Contract ABI for Verified Contract Source Codes"
      parameters:
        - $ref: "#/components/parameters/addressMust"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  /contract/getsourcecode:
    get:
      tags:
        - 'Contracts'
      summary: "Get verified contract source code and verification metadata by contract address."
      operationId: getVerifiedContractSourceCodeByAddress
      description: "Get Contract Source Code for Verified Contract Source Codes"
      parameters:
        - $ref: "#/components/parameters/addressMust"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractInfo"
  /contract/getContractCreation:
    get:
      tags:
        - 'Contracts'
      summary: "Get deployer address and creation transaction hash for up to 5 contract addresses."
      operationId: getContractCreationInfoByContractAddresses
      description: "Returns a contract's deployer address and transaction hash it was created, up to 5 at a time."
      parameters:
        - $ref: "#/components/parameters/contractAddressesParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractCreationInfo"
  /contract/verifysourcecode:
    post:
      tags:
        - 'Contracts'
      summary: "Submit verified contract source code for verification using form parameters and receive a tracking GUID or status message."
      operationId: submitContractSourceCodeVerification
      description: "Verify Source Code - Source Code Submission Gist"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/VerifySourcecode"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  /contract/checkverifystatus:
    get:
      tags:
        - 'Contracts'
      summary: "Check source code verification submission status by GUID."
      operationId: checkContractSourceVerificationStatusByGuid
      description: "Verify Source Code - Check Source Code Verification Submission Status"
      parameters:
        - $ref: "#/components/parameters/guidMust"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractInfo"
  /contract/verifyproxycontract:
    get:
      tags:
        - 'Contracts'
      summary: "Submit proxy contract verification for an address and optional expected implementation."
      operationId: submitProxyContractVerification
      description: "Verifying Proxy Contract using cURL"
      parameters:
        - $ref: "#/components/parameters/addressMust"
        - $ref: "#/components/parameters/expectedimplementation"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  /contract/checkproxyverification:
    get:
      tags:
        - 'Contracts'
      summary: "Check proxy contract verification submission status by GUID."
      operationId: checkProxyContractVerificationStatusByGuid
      description: "Checking Proxy Contract Verification Submission Status using cURL"
      parameters:
        - $ref: "#/components/parameters/guidMust"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonResponse"
  /contract/verified:
    get:
      tags:
        - Contracts
      summary: "List verified contracts using cursor pagination with optional time filters and sort order."
      operationId: listVerifiedContractsWithCursor
      description: |-
        Returns a cursor-paginated list of verified contracts.
        Rules:
        1. Arbitrary page navigation is not supported.
        2. Clients must use the `next` value returned by the server.
      parameters:
        - $ref: "#/components/parameters/cursorParamWithoutMaximum"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortParam"
      responses:
        200:
          description: Cursor-paginated verified contracts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationListByCursor"
  /contract/verified/latest:
    get:
      tags:
        - Contracts
      summary: "List latest verified contracts using filter-based pagination across compiler, license, address, deployer, block, time, and sort filters."
      operationId: listLatestVerifiedContractsByFilters
      description: Returns a filter-paginated list of verified contracts.
      parameters:
        - in: query
          name: compiler
          description: "Contract compiler (solc or vyper) "
          required: false
          schema:
            type: string
        - in: query
          name: contractName
          description: "The contract name"
          required: false
          schema:
            type: string
        - in: query
          name: compilerVersion
          description: |-
            Compiler version used
            for solc compiler, such as v0.8.24+commit.e11b9ed9
            for vyper compiler, such as vyper:0.4.0
          required: false
          schema:
            type: string
        - in: query
          name: licenseType
          description: |-
            Valid codes 1-14 where
            1.  No License (None)
            2.  The Unlicense (Unlicense)
            3. 	MIT License (MIT)
            4. 	GNU General Public License v2.0 (GNU GPLv2)
            5. 	GNU General Public License v3.0 (GNU GPLv3)
            6. 	GNU Lesser General Public License v2.1 (GNU LGPLv2.1)
            7. 	GNU Lesser General Public License v3.0 (GNU LGPLv3)
            8. 	BSD 2-clause 'Simplified' license (BSD-2-Clause)
            9. 	BSD 3-clause 'New' Or 'Revised' license* (BSD-3-Clause)
            10. Mozilla Public License 2.0 (MPL-2.0)
            11. Open Software License 3.0 (OSL-3.0)
            12. Apache 2.0 (Apache-2.0)
            13. GNU Affero General Public License (GNU AGPLv3)
            14. Business Source License (BSL 1.1)
          required: false
          schema:
            type: string
        - in: query
          name: contractAddress
          description: "The contract address"
          required: false
          schema:
            type: string
        - in: query
          name: deployerAddress
          description: "The contract deployer address"
          required: false
          schema:
            type: string
        - in: query
          description: "If the contract has nametag, the value is true/false."
          name: hasNametag
          required: false
          schema:
            type: boolean
            enum:
              - true
              - false 
            default: false
        - in: query
          description: "The field used for sorting. The value is verified_time or txn_volume"
          name: sortField
          required: false
          schema:
            type: string
            default: verified_time
        - $ref: "#/components/parameters/minEpochNumberParam"
        - $ref: "#/components/parameters/maxEpochNumberParam"
        - $ref: "#/components/parameters/minTimestampParam"
        - $ref: "#/components/parameters/maxTimestampParam"
        - $ref: "#/components/parameters/sortParam"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParam"
      responses:
        200:
          description: Filter-paginated verified contracts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationListByFilter"
  /contract/lookupAbi:
    get:
      tags:
        - Contracts
      summary: "Look up function, error, or event ABI signatures by selector or topic hash."
      operationId: lookupAbiSignaturesBySelectorOrTopicHash
      description: Look up one or more function, error or event signatures by hash.
      parameters:
        - in: query
          name: function
          description: A comma-delimited list of function or error hashes with leading 0x prefix. Must be exactly 10 characters (0x + 8 hex chars). Supports up to 100 hashes at a time.
          required: false
          schema:
            type: string
        - in: query
          name: error
          description: A comma-delimited list of function or error hashes with leading 0x prefix. Must be exactly 10 characters (0x + 8 hex chars). Supports up to 100 hashes at a time.
          required: false
          schema:
            type: string
        - in: query
          name: event
          description: A comma-delimited list of event hashes with leading 0x prefix. Must be exactly 66 characters (0x + 64 hex chars). Supports up to 100 hashes at a time.
          required: false
          schema:
            type: string
      responses:
        200:
          description: The resulting signatures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureResponse"
              examples:
                successful_lookup:
                  $ref: "#/components/examples/SignatureSearchResults"
  /contract/searchAbi:
    get:
      tags:
        - Contracts
      summary: "Search function, error, or event ABI signatures by case-sensitive name pattern with wildcard support."
      operationId: searchAbiSignaturesByNamePattern
      description: Search signatures by name (case sensitive) with wildcards, limited to the first 100 unordered results per type.
      parameters:
        - in: query
          name: signature
          description: The signature of the function, error or event to search for. Case sensitive. Use '*' and '?' for wildcards.
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/signatureTypeParam"
      responses:
        200:
          description: The resulting signatures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureResponse"
              examples:
                successful_lookup:
                  $ref: "#/components/examples/SignatureSearchResults"
  /token/tokeninfos:
    get:
      tags:
        - 'Tokens'
      summary: "Get token metadata for up to 30 contract addresses in one request."
      operationId: getBatchTokenInfosByContractAddresses
      description: "Get Token Info by contract addresses. Supports up to 30 tokens at a time."
      parameters:
        - $ref: "#/components/parameters/contractArrayParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenInfos"
  /token/tokeninfo/refresh:
    post:
      tags:
        - 'Tokens'
      summary: "Refresh token metadata for a contract when token name or symbol is missing."
      operationId: refreshTokenInfoByContractIfMissingNameOrSymbol
      description: "Refresh Token Info by contract address only when token name/symbol is empty."
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                contract:
                  type: string
                  required: true
                  description: "Contract address, on testnet, it's like cfxtest:acepe88unk7fvs18436178up33hb4zkuf62a9dk1gv,
                    on mainnet it's like cfx:acf2rcsh8payyxpg6xj7b0ztswwh81ute60tsw35j7"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshedTokenInfo"
  /nft/balances:
    get:
      tags:
        - 'NFT Assets'
      summary: "List NFT asset balances for an owner address with pagination."
      operationId: listNftBalancesByOwner
      description: "Get balances of NFT assets for account address."
      parameters:
        - $ref: "#/components/parameters/ownerParamMust"
        - $ref: "#/components/parameters/skipParamWithoutMaximum"
        - $ref: "#/components/parameters/limitParam"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NFTBalanceList"
  /nft/tokens:
    get:
      tags:
        - 'NFT Assets'
      summary: "List NFT tokens by owner and/or contract, with cursor or skip pagination, sorting, and optional brief metadata."
      operationId: listNftTokensByOwnerOrContract
      description: |-
        Get token id array of specified NFT contract for account address.
        At least one of the parameters 'contract' and 'owner' is required.
      parameters:
        - $ref: "#/components/parameters/contractParam"
        - $ref: "#/components/parameters/ownerParam"
