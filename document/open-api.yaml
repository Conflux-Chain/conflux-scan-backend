        2. CFX Transfer
          2.1 'call'
          2.2 'create'
          2.3 'gas_payment'
          2.4 'storage_collateral'
          2.5 'sponsor_balance_for_gas'
          2.6 'sponsor_balance_for_collateral'
          2.7 'staking_balance'
          2.8 'balance'
        3. Token Transfer
          3.1 'transfer_20'
          3.2 'transfer_721'
          3.3 'transfer_1155'
