components:
  schemas:
    ResponseBase:
      type: object
      properties:
        code:
          type: integer
          description: Response status code (0 for success, others for error).
          example: 0
        message:
          type: string
          description: Response message.
          example: "success"
        data:
          description: Endpoint-specific response payload.    
    Version:
      allOf:
        - $ref: "#/components/schemas/ResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                version:
                  type: string
    AddressInfo:
      type: object
      additionalProperties:
        type: object
        properties:
          contract:
            type: object
            properties:
              name:
                type: string
                description: "Name of the contract."
              verify:
                type: object
                properties:
                  result:
                    type: integer
                    description: "Verify result of the contract, 1-verified, 0-not verified."
          token:
            type: object
            properties:
              name:
                type: string
                description: "Name of the token."
              symbol:
                type: string
                description: "Symbol of the token."
              decimals:
                type: integer
                description: "Decimal of the token, omit if empty."
                nullable: true
              website:
                type: string
                description: "Website  of the token, optional"
                nullable: true
              iconUrl:
                type: string
                description: "Icon url, optional"
                nullable: true
              tokenType:
                type: string
                description: "Token type, CRC20、CRC721 or CRC1155"
    AssetsOfAccount:
      allOf:
        - $ref: "#/components/schemas/ResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      contract:
                        description: "Contract address of the token. Omit if it is native token."
                        type: string
                        nullable: true
                      name:
                        description: "Name of the token."
                        type: string
                      symbol:
                        description: "Symbol of the token."
                        type: string
                        example: CFX
                      decimals:
                        description: "Decimal of the token, omit if empty."
                        type: integer
                        nullable: true
                      type:
                        description: "Token type, CRC20、CRC721、CRC1155 or native"
                        type: string
                      iconUrl:
                        description: "Icon url, optional."
                        type: string
                        example: "http://scan-icons.oss-cn-hongkong.aliyuncs.com/testnet/xxxxxx.svg"
                        nullable: true
                      quoteUrl:
                        description: "The quote url of token, optional."
                        type: string
                        nullable: true
                      priceInUSDT:
                        description: "The price of token in USDT, optional."
                        type: string
                        nullable: true
                      amount:
                        description: "The token/native-token balance of an account, the string is not divided by the token decimal."
                        type: string
                      stakingAmount:
                        description: "The staking token/native-token balance of an account, the string is not divided by the token decimal."
                        type: string
    AccountInfos:
      type: object
      additionalProperties:
        type: object
        properties:
          contract:
            type: object
            properties:
              name:
                type: string
                description: "Name of the contract."
          token:
            type: object
            properties:
              name:
                type: string
                description: "Name of the token."
              symbol:
                type: string
                description: "Symbol of the token."
              decimals:
                type: integer
                description: "Decimal of the token, omit if empty."
                nullable: true
              iconUrl:
                type: string
                description: "Icon url, optional"
                nullable: true
              website:
                type: string
                description: "Website  of the token, optional"
                nullable: true
              tokenType:
                type: string
                description: "Token type, CRC20、CRC721 or CRC1155"
          verification:
            type: object
            properties:
              name:
                type: string
                description: "Name of the verified contract."
          eSpace:
            type: object
            properties:
              address:
                type: string
                description: "ESpace address."
          ens:
            type: object
            properties:
              name:
                type: string
                description: "ENS name."
          nameTag:
            type: object
            properties:
              nameTag:
                type: string
                description: "Name tag."
              website:
                type: string
                description: Website.
              desc:
                type: string
                description: Description.
              labels:
                type: array
                description: "Label array."
                items:
                  type: string
                  description: Label.
              caution:
                type: string
                description: "The caution = 1 when labels contains a caution label. The caution = 0 when others"
          implementation:
            type: object
            properties:
              name:
                type: string
                description: "Name of the implementation contract."
              address:
                type: string
                description: "Address of the implementation contract."
              proxyPattern:
                type: string
                description: "Proxy pattern."
    VerificationList:
      type: array
      items:
        type: object
        properties:
          address:
            type: string
            example: |-
              on testnet, it's like cfxtest:aatmcd6m3e4gjczt9v9d1gca1d77trk3vjr04w5yha
              on mainnet, it's like cfx:aanjcf1esdz50j6zhkm0k60wc7669tfkw28mzudg24
          contractName:
            type: string
            example: MyToken
          compiler:
            type: string
            example: solc
          compilerVersion:
            type: string
            example: 0.8.24
          longCompilerVersion:
            type: string
            example: "v0.8.24+commit.e11b9ed9"
          compilerVulnerabilities:
            type: number
            example: 1
          language:
            type: string
            example: solidity
          codeFormat:
            type: string
            example: "Solidity(Json)"
          balance:
            type: string
            example: 10000
          txns:
            type: number
            example: 10000
          setting:
            type: object
            properties:
              optimizationEnabled:
                type: boolean
              constructorArguments:
                type: boolean
            example:
              optimizationEnabled: true
              constructorArguments: false
          license:
            type: string
            example: MIT
          verifiedAt:
            type: integer
            example: 1767225600
          deployer:
            type: string
            example: |-
              on testnet, it's like cfxtest:aatmcd6m3e4gjczt9v9d1gca1d77trk3vjr04w5yha
              on mainnet, it's like cfx:aanjcf1esdz50j6zhkm0k60wc7669tfkw28mzudg24
          blockNumber:
            type: number
            example: 10000
          hasNametag:
            type: boolean
            example: true
    VerificationListByCursor:
      allOf:
        - $ref: "#/components/schemas/ResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                total:
                  type: integer
                next:
                  description: A cursor to retrieve the next page
                  type: string
                list:
                  $ref: "#/components/schemas/VerificationList"
    VerificationListByFilter:
      allOf:
        - $ref: "#/components/schemas/ResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                total:
                  type: integer
                listLimit:
                  type: integer
                  description: "Maximum number of records this API returns in total. Only the latest listLimit records are accessible; requesting with skip >= listLimit returns an invalid parameter error."
                  example: 5000
                list:
                  $ref: "#/components/schemas/VerificationList"
    SignatureResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseBase"
