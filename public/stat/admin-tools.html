<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Scan 管理工具</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; background: #f4f6fa; color: #172235; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #172235; color: white; padding: 1rem max(1rem, calc((100vw - 1040px)/2)); font-weight: 700; }
    .layout { max-width: 1040px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 1.5rem; }
    nav, main { background: white; border: 1px solid #e1e5ed; border-radius: 12px; padding: 1.5rem; }
    nav a { display: block; padding: .6rem .75rem; color: #174ea6; text-decoration: none; background: #eef4ff; border-radius: 6px; }
    h1 { font-size: 1.4rem; margin: 0 0 .4rem; }
    p { margin: .25rem 0 1.4rem; color: #526071; }
    label { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    input { width: 100%; padding: .7rem; border: 1px solid #aeb8c6; border-radius: 6px; font: inherit; }
    button { margin-top: 1rem; padding: .65rem 1.1rem; border: 0; border-radius: 6px; background: #1557b0; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button.secondary { background: #e9edf4; color: #172235; margin-left: .5rem; }
    #message { min-height: 1.5rem; margin: 1rem 0; color: #b42318; }
    dl { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: .7rem 1rem; margin: 1rem 0 0; }
    dt { font-weight: 600; } dt.nowrap { white-space: nowrap; } dd { margin: 0; overflow-wrap: anywhere; } #token { white-space: pre-wrap; }
    code { font-size: .92rem; }
    #gate { display: block; max-width: 560px; }
    [hidden] { display: none !important; }
    #address.epoch-mode > * { display: none; }
    #address.epoch-mode #epoch-checker { display: block; }
    @media (max-width: 650px) { .layout { grid-template-columns: 1fr; margin: 1rem auto; } nav, main { padding: 1rem; } }
  </style>
</head>
<body>
  <header>Scan 管理工具</header>
  <section id="gate" class="layout">
    <main>
      <h1>管理入口</h1>
      <p>请输入管理密码。</p>
      <form id="gate-form">
        <label for="gate-user">用户名</label>
        <input id="gate-user" name="username" type="text" autocomplete="username" value="admin" required>
        <label for="gate-input">管理密码</label>
        <input id="gate-input" name="password" type="password" autocomplete="current-password" required>
        <button id="gate-submit" type="submit">进入</button>
      </form>
      <div id="gate-message" role="status" aria-live="polite"></div>
    </main>
  </section>
  <div class="layout" id="app" hidden>
    <nav aria-label="功能导航"><a href="#address">地址查询</a><a href="#epoch-checker">数据检查</a></nav>
    <main id="address" class="page">
      <h1>地址查询</h1>
      <p>输入 hex ID、0x 地址或 Conflux base32 地址，查询 hex40 和 token 表。</p>
      <form id="lookup-form">
        <button type="button" class="secondary" id="forget">退出</button>
        <label for="address-input">地址或 hex ID</label>
        <input id="address-input" type="text" autocomplete="off" spellcheck="false" required placeholder="例如 123、0x... 或 cfx:...">
        <button id="submit" type="submit">查询</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
      <section id="result" hidden aria-label="查询结果">
        <dl>
          <dt>Hex</dt><dd><code id="hex"></code></dd>
          <dt>Base32</dt><dd><code id="base32"></code></dd>
          <dt>Hex ID</dt><dd><code id="hex-id"></code></dd>
          <dt>Token</dt><dd id="token"></dd>
        </dl>
      </section>
      <section id="epoch-checker" class="page" hidden>
        <h1>Epoch 数据检查</h1>
        <p>全局只允许一台机器运行。启动、停止和查看双向检查进度。</p>
        <button type="button" id="checker-start">启动</button>
        <button type="button" class="secondary" id="checker-resume">恢复并继续</button>
        <button type="button" class="secondary" id="checker-stop">停止</button>
        <button type="button" class="secondary" id="checker-refresh">刷新</button>
        <label for="checker-interval">间隔（秒，0 表示连续运行）</label>
        <input id="checker-interval" type="number" min="0" max="86400" step="0.1" value="0">
        <dl><dt>状态</dt><dd id="checker-enabled">-</dd><dt>实例</dt><dd id="checker-owner">-</dd><dt>检查间隔</dt><dd id="checker-interval-current">-</dd><dt class="nowrap">最新 finalized</dt><dd id="checker-latest">-</dd><dt>正向游标</dt><dd id="checker-forward">-</dd><dt>正向速度</dt><dd id="checker-forward-rate">-</dd><dt>正向区块时间</dt><dd id="checker-forward-time">-</dd><dt>反向游标</dt><dd id="checker-backward">-</dd><dt>反向速度</dt><dd id="checker-backward-rate">-</dd><dt>反向区块时间</dt><dd id="checker-backward-time">-</dd><dt>暂停</dt><dd id="checker-paused">-</dd></dl>
      </section>
    </main>
  </div>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      let password = '';
      const gate = $('gate');
      const app = $('app');
      const gateInput = $('gate-input');
      const gateMessage = $('gate-message');
      $('gate-form').addEventListener('submit', async event => {
        event.preventDefault();
        gateMessage.textContent = '';
        $('gate-submit').disabled = true;
        try {
          const response = await fetch('/stat/admin/auth', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({password: gateInput.value}),
            cache: 'no-store',
          });
          const data = responseData(response, await response.json());
          if (data?.authenticated !== true) throw new Error('验证响应无效');
          password = gateInput.value;
          gateInput.value = '';
          gate.hidden = true;
          app.hidden = false;
          $('address-input').focus();
        } catch (error) {
          gateMessage.textContent = error.message || '验证失败';
        } finally {
          $('gate-submit').disabled = false;
        }
      });
      const message = $('message');
      const result = $('result');

      $('forget').addEventListener('click', () => {
        password = '';
        result.hidden = true;
        app.hidden = true;
        gate.hidden = false;
        gateInput.value = '';
        gateInput.focus();
      });

      function responseData(response, body) {
        const data = body?.data ?? body?.result;
        if (!response.ok || (body?.code !== undefined && body.code !== 0)
            || (body?.status !== undefined && body.status !== '1')
            || (data?.code !== undefined && data.code !== 0)) {
          throw new Error(data?.message || body?.message || '请求失败');
        }
        return data;
      }

      $('lookup-form').addEventListener('submit', async event => {
        event.preventDefault();
        result.hidden = true;
        message.textContent = '';
        $('submit').disabled = true;
        try {
          const response = await fetch('/stat/admin/address', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({address: $('address-input').value.trim(), password}),
            cache: 'no-store',
          });
          const body = await response.json();
          const data = responseData(response, body);
          if (!data || !Object.prototype.hasOwnProperty.call(data, 'hexId')) throw new Error('查询响应无效');
          $('hex').textContent = data.hex || '未找到';
          $('base32').textContent = data.base32 || '未找到';
          $('hex-id').textContent = data.hexId || '未找到';
          const token = data.token;
          $('token').textContent = token ? JSON.stringify(token, null, 2) : '未找到';
          result.hidden = false;
        } catch (error) {
          message.textContent = error.message || '查询失败';
        } finally {
          $('submit').disabled = false;
        }
      });
      function selectedInterval() {
        const value = Number($('checker-interval').value);
        if (!Number.isFinite(value) || value < 0 || value > 86400) throw new Error('interval 必须是 0 到 86400 秒之间的数字');
        return value;
      }
      async function checkerAction(action, extra = {}) {
        const response = await fetch('/stat/admin/epoch-checker/' + action, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password, ...extra}), cache:'no-store'});
        return responseData(response, await response.json());
      }
      async function refreshChecker() {
        try {
          const data = await checkerAction('status');
          $('checker-enabled').textContent = data.enabled ? '运行中' : '已停止';
          $('checker-interval-current').textContent = data.interval == null ? '-' : data.interval + ' 秒';
          if (document.activeElement !== $('checker-interval') && data.interval != null) $('checker-interval').value = data.interval;
          let owner = data.owner || '';
          try { owner = owner ? JSON.parse(owner).owner + '（租约至 ' + new Date(JSON.parse(owner).expiresAt).toLocaleString() + '）' : '无'; } catch (_) { owner = owner || '无'; }
          $('checker-owner').textContent = owner;
          $('checker-latest').textContent = (data.latestFinalized == null ? '-' : data.latestFinalized) + '（' + formatTime(data.latestFinalizedTime) + '）';
          $('checker-forward').textContent = data.forward == null ? '-' : data.forward;
          $('checker-forward-rate').textContent = data.forwardRate == null ? '-' : data.forwardRate.toFixed(2) + ' epoch/s';
          $('checker-forward-time').textContent = formatTime(data.forwardTime);
          $('checker-backward').textContent = data.backward == null ? '-' : data.backward;
          $('checker-backward-rate').textContent = data.backwardRate == null ? '-' : data.backwardRate.toFixed(2) + ' epoch/s';
          $('checker-backward-time').textContent = formatTime(data.backwardTime);
          $('checker-paused').textContent = (data.forwardPaused ? '正向 ' : '') + (data.backwardPaused ? '反向' : '') || '否';
        } catch (error) { message.textContent = error.message || '获取状态失败'; }
      }
      $('checker-start').addEventListener('click', async () => { await checkerAction('start', {interval: selectedInterval()}); await refreshChecker(); });
      $('checker-resume').addEventListener('click', async () => { await checkerAction('resume', {interval: selectedInterval()}); await refreshChecker(); });
      $('checker-stop').addEventListener('click', async () => { await checkerAction('stop'); await refreshChecker(); });
      $('checker-refresh').addEventListener('click', refreshChecker);
      function formatTime(value) { return value ? new Date(value).toLocaleString() : '未同步'; }
      document.querySelectorAll('nav a').forEach(link => link.addEventListener('click', event => {
        event.preventDefault();
        if (link.hash === '#epoch-checker') { $('address').classList.add('epoch-mode'); $('epoch-checker').hidden = false; }
        else { $('address').classList.remove('epoch-mode'); $('epoch-checker').hidden = true; }
        if (link.hash === '#epoch-checker') refreshChecker();
      }));
    })();
  </script>
</body>
</html>
